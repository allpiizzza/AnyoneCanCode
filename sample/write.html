<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>후기 쓰기 — 책후기 게시판</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="index.html"><span class="mark">📚</span> 책후기 게시판</a>
    <span class="header-tag">우리 독서모임의 기록</span>
  </div>
</header>

<div class="wrap page">

  <h1 class="page-title">후기 남기기</h1>
  <p class="page-sub">✏️ 다 읽지 않았어도 괜찮아요, 중간 후기도 환영입니다</p>

  <form class="notecard" id="form">
    <div class="field">
      <label for="title">책 제목 · 후기 제목</label>
      <input type="text" id="title" name="title" maxlength="80" placeholder="예: 아몬드 — 다시 읽어도 좋은 책" required>
    </div>

    <div class="field">
      <label for="author">이름</label>
      <input type="text" id="author" name="author" maxlength="20" placeholder="예: 정하늘" required>
    </div>

    <div class="field">
      <label for="content">내용</label>
      <textarea id="content" name="content" placeholder="어떤 장면이 오래 남았나요? 누구에게 권하고 싶은 책인가요?" required></textarea>
    </div>

    <div class="form-actions">
      <a class="btn btn-ghost" href="index.html">← 취소</a>
      <button class="btn" type="submit">등록하기</button>
    </div>
  </form>

</div>

<footer class="site-footer">
  📚 책후기 게시판 · 비개발자 웹사이트 워크샵 완성본 예시
</footer>

<script src="api.js"></script>
<script>
var form = document.getElementById('form');
var btn = form.querySelector('button[type=submit]');

function setMsg(text, bad){
  var box = document.getElementById('formMsg');
  if(!box){
    box = document.createElement('p');
    box.id = 'formMsg';
    form.appendChild(box);
  }
  box.className = 'form-msg' + (bad ? ' bad' : '');
  box.textContent = text;
}

form.addEventListener('submit', function(e){
  e.preventDefault();
  var title = document.getElementById('title').value.trim();
  var author = document.getElementById('author').value.trim();
  var content = document.getElementById('content').value.trim();

  if(!title || !author || !content){
    setMsg('제목, 이름, 내용을 모두 채워주세요.', true);
    return;
  }

  btn.disabled = true;
  var label = btn.textContent;
  btn.textContent = '올리는 중…';
  setMsg('스프레드시트에 저장하고 있어요…');

  savePost({ title: title, author: author, content: content })
    .then(function(){
      setMsg('저장했어요. 목록으로 이동합니다.');
      location.href = 'index.html';
    })
    .catch(function(err){
      if(err && err.unsure){
        /* 응답을 못 받았을 뿐, 시트에는 들어갔을 수 있습니다.
           "실패"라고 하면 같은 글을 두 번 올리게 됩니다. */
        setMsg('답을 못 받았어요. 목록에서 올라갔는지 확인해주세요…', true);
        setTimeout(function(){ location.href = 'index.html'; }, 1800);
        return;
      }
      btn.disabled = false;
      btn.textContent = label;
      setMsg('저장하지 못했어요 — ' + (err.message || err), true);
    });
});
</script>

</body>
</html>
