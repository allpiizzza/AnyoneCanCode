<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>후기 보기 — 책후기 게시판</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="index.html"><span class="mark">📚</span> 책후기 게시판</a>
    <span class="header-tag">우리 독서모임의 기록</span>
  </div>
</header>

<div class="wrap page">
  <div id="view"></div>
  <a class="backlink" href="index.html">← 목록으로 돌아가기</a>
</div>

<footer class="site-footer">
  📚 책후기 게시판 · 비개발자 웹사이트 워크샵 완성본 예시
</footer>

<script src="api.js"></script>
<script>
var view = document.getElementById('view');
var id = new URLSearchParams(location.search).get('id');

view.innerHTML = '<div class="loading">📖 후기를 불러오는 중…</div>';

findPost(id).then(function(res){
  if(res.offline) showOfflineBanner();

  var post = res.post;
  if(!post){
    view.innerHTML =
      '<div class="empty">' +
        '<span class="face">🔍</span>' +
        '<div class="t">후기를 찾을 수 없어요</div>' +
        '<div class="d">주소가 잘못되었거나 삭제된 글입니다.</div>' +
      '</div>';
    return;
  }

  document.title = post.title + ' — 책후기 게시판';

  view.innerHTML =
    '<article class="article">' +
      '<span class="quote">“</span>' +
      '<h1>' + escapeHtml(post.title) + '</h1>' +
      '<div class="meta"><span>✍️ ' + escapeHtml(post.author) + '</span><span class="sep">·</span><span>' + escapeHtml(post.date) + '</span></div>' +
      '<div class="content">' + escapeHtml(post.content) + '</div>' +
    '</article>';
});
</script>

</body>
</html>
