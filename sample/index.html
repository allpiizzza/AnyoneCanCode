<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>책후기 게시판</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="index.html"><span class="mark">📚</span> 책후기 게시판</a>
    <span class="header-tag">우리 독서모임의 기록</span>
  </div>
</header>

<section class="hero">
  <span class="deco d1">🔖</span>
  <span class="deco d2">💭</span>
  <span class="deco d3">☕</span>
  <span class="deco d4">🔖</span>
  <div class="wrap">
    <h1>우리가 읽고 남긴 이야기들</h1>
    <p>이번 달 읽은 책, 어땠나요?</p>
  </div>
</section>

<div class="wrap">

  <div class="write-cta">
    <a class="btn" href="write.html">✏️ 새 후기 남기기</a>
    <div class="hint">한 문장이어도 좋아요. 다음 모임의 이야깃거리가 됩니다.</div>
  </div>

  <div id="list"></div>

</div>

<footer class="site-footer">
  📚 책후기 게시판 · 비개발자 웹사이트 워크샵 완성본 예시
</footer>

<script src="api.js"></script>
<script>
function excerpt(text){
  const flat = String(text).replace(/\s+/g, ' ').trim();
  return flat.length > 64 ? flat.slice(0, 64) + '…' : flat;
}

function render(posts){
  const list = document.getElementById('list');

  if(!posts.length){
    list.innerHTML =
      '<div class="empty">' +
        '<span class="face">🍃</span>' +
        '<div class="t">아직 등록된 후기가 없어요</div>' +
        '<div class="d">위 버튼으로 첫 책후기를 남겨보세요.</div>' +
      '</div>';
    return;
  }

  let html = '<div class="timeline">';
  posts.forEach(function(p, i){
    html +=
      '<div class="tl-item">' +
        '<span class="marker">📖</span>' +
        '<a class="tl-card c' + (i % 3 + 1) + '" href="detail.html?id=' + encodeURIComponent(p.id) + '">' +
          '<div class="tl-meta"><span>' + escapeHtml(p.date) + '</span><span class="sep">·</span><span>' + escapeHtml(p.author) + '</span></div>' +
          '<h2>' + escapeHtml(p.title) + '</h2>' +
          '<p class="excerpt">' + escapeHtml(excerpt(p.content)) + '</p>' +
          '<div class="more">전체 후기 읽기 →</div>' +
        '</a>' +
      '</div>';
  });
  html += '</div>';
  html += '<div class="tl-end">🍵 여기까지가 지금까지의 기록이에요</div>';

  list.innerHTML = html;
}

document.getElementById('list').innerHTML =
  '<div class="loading">📚 후기를 불러오는 중…</div>';

loadPosts().then(function(res){
  if(res.offline) showOfflineBanner(res.reason);
  render(res.posts);
});
</script>

</body>
</html>
